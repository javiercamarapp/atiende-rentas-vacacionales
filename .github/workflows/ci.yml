name: CI

# Equivalente en GitHub Actions del pipeline local `npm run ci`
# (docs/fase2/LOTES.md, Lote 0). No se ejecuta en esta sesión (sin runner de
# CI remoto disponible aquí) — es la definición reproducible para cuando el
# repo se conecte a un remoto con Actions habilitado. Orden de gates
# inspirado en el patrón verificado de Likida (RV20 §8): instalar con
# lockfile exacto → lint → typecheck → test → build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25.6.1"
          cache: "npm"

      - name: Instalar dependencias (lockfile exacto)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm run test

      - name: Conteo de pruebas por paquete (Lote 10)
        run: npm run verificar:lotes

      - name: Pruebas de integración (embedded-postgres real)
        run: npm run test:integration

      - name: Pruebas adversariales (subset de sync, Lote 2/11)
        run: npm run test:adversarial

      - name: Build
        run: npm run build

      # test:e2e (Playwright) queda fuera de este gate: requiere un
      # navegador headless instalado (`npx playwright install`) que este
      # workflow todavía no provisiona — se añade en el commit de Lote 4/11
      # que lo introduzca, no aquí. test:integration y test:adversarial SÍ
      # entraron en este commit (Lote 10) porque ya tienen sujeto real
      # desde Lote 1/2/3 en adelante — ver docs/fase2/LOTES.md.
