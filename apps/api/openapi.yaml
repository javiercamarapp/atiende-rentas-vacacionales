openapi: 3.1.0
info:
  title: Atiende Rentas Vacacionales — API
  version: 0.3.0
  description: |
    Contrato de API de `apps/api` (Lote 3: auth/roles/RLS/auditoría sobre el
    dominio de calendario de Lote 1). Fuente de verdad ejecutable: los
    esquemas `zod` de `apps/api/src/contrato/tipos.ts` (importables como
    `@atiende-rv/api/contrato`) — este archivo es la descripción
    human-readable del mismo contrato, publicada en el primer commit de
    este lote para que Lote 4 (frontend) pueda empezar contra tipos
    estables antes de que todos los endpoints tengan implementación
    completa.

    Reglas de dominio no negociables reflejadas en este contrato (D-006,
    D-011, BLUEPRINT): la API NUNCA expone cancelación ni modificación de
    una reserva cuyo origen sea un canal externo (Airbnb/Vrbo/Booking) —
    solo reservas DIRECTAS (creadas por esta misma API). Tampoco expone
    envío de mensajes a huéspedes (eso es Lote 6, con aprobación humana
    obligatoria). `POST /canales/:id/sync` solo ENCOLA una solicitud de
    sincronización manual en `outbox_evento`; la ejecución real la hace el
    worker de Lote 2.
servers:
  - url: http://localhost:8787
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: tenants
  - name: usuarios
  - name: propiedades
  - name: unidades
  - name: calendario
  - name: reservas
  - name: bloqueos
  - name: canales
  - name: conflictos
  - name: auditoria
  - name: operacion
  - name: finanzas
  - name: pricing
  - name: reportes
  - name: backoffice

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoLogin" }
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaTokens" }
        "401":
          description: Credenciales inválidas (mismo error exista o no el email)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorHttp" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotar el refresh token y emitir un nuevo access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoRefresh" }
      responses:
        "200":
          description: Nuevo par de tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaTokens" }
        "401":
          description: Refresh token inválido, revocado o expirado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorHttp" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revocar un refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoRefresh" }
      responses:
        "204": { description: Sesión cerrada (no-op si el token ya era inválido) }

  /tenants:
    post:
      tags: [tenants]
      summary: Alta de un tenant (empresa gestora) — exclusivo de superadmin
      responses:
        "201": { description: Tenant creado }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /tenants/me:
    get:
      tags: [tenants]
      summary: Tenant del usuario autenticado
      responses:
        "200": { description: Datos del tenant }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /usuarios:
    get:
      tags: [usuarios]
      summary: Listar usuarios del tenant — admin_gestora/superadmin
      responses:
        "200": { description: Lista de usuarios }
        "403": { $ref: "#/components/responses/RolForbidden" }
    post:
      tags: [usuarios]
      summary: Alta de un colaborador/rol interno dentro del tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearUsuario" }
      responses:
        "201": { description: Usuario creado }
        "403": { $ref: "#/components/responses/RolForbidden" }
        "422": { $ref: "#/components/responses/Validacion" }

  /propiedades:
    get:
      tags: [propiedades]
      summary: Listar propiedades visibles para el usuario autenticado (RLS)
      responses:
        "200": { description: Lista de propiedades }
    post:
      tags: [propiedades]
      summary: Crear propiedad — admin_gestora/superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearPropiedad" }
      responses:
        "201": { description: Propiedad creada }
        "403": { $ref: "#/components/responses/RolForbidden" }
        "422": { $ref: "#/components/responses/Validacion" }

  /propiedades/{id}:
    get:
      tags: [propiedades]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Propiedad }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /unidades:
    get:
      tags: [unidades]
      responses:
        "200": { description: Lista de unidades }
    post:
      tags: [unidades]
      summary: Crear unidad — admin_gestora/superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearUnidad" }
      responses:
        "201": { description: Unidad creada }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /unidades/{id}/calendario:
    get:
      tags: [calendario]
      summary: Calendario de una unidad resuelto noche a noche (capa/razón/estado/origen)
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: desde
          in: query
          required: true
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Calendario resuelto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaCalendario" }
        "422": { $ref: "#/components/responses/RangoInvalido" }

  /reservas:
    post:
      tags: [reservas]
      summary: Crear una reserva DIRECTA (nunca una reserva "de canal")
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearReserva" }
      responses:
        "201": { description: Reserva creada }
        "409": { $ref: "#/components/responses/UnidadNoDisponible" }
        "422": { $ref: "#/components/responses/RangoInvalido" }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /reservas/{id}:
    patch:
      tags: [reservas]
      summary: Modificar fechas de una reserva DIRECTA propia
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoModificarReserva" }
      responses:
        "200": { description: Reserva modificada }
        "403":
          description: Rol sin permiso, o la reserva no es directa (viene de un canal)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorHttp" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/UnidadNoDisponible" }
        "422": { $ref: "#/components/responses/RangoInvalido" }

  /reservas/{id}/cancelar:
    post:
      tags: [reservas]
      summary: Cancelar una reserva DIRECTA propia — solo colaborador "acceso_total"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Reserva cancelada }
        "403":
          description: Rol/nivel sin permiso para cancelar, o la reserva no es directa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorHttp" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/ConflictoPendiente" }

  /bloqueos:
    post:
      tags: [bloqueos]
      summary: Crear bloqueo de propietario/mantenimiento/buffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearBloqueo" }
      responses:
        "201": { description: Bloqueo creado (nunca rechazado por solape — se registra conflicto_calendario) }
        "422": { $ref: "#/components/responses/RangoInvalido" }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /bloqueos/{id}:
    delete:
      tags: [bloqueos]
      summary: Cancelar un bloqueo (nunca reabre noches ocupadas por otra capa)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Bloqueo cancelado }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /conflictos:
    get:
      tags: [conflictos]
      parameters:
        - name: resuelto
          in: query
          schema: { type: string, enum: ["true", "false"] }
          description: "'true' incluye ya resueltos; por defecto solo pendientes"
      responses:
        "200": { description: Lista de conflictos }

  /canales:
    get:
      tags: [canales]
      summary: Cuentas de canal del tenant con estado de conexión honesto (D-017/D-019)
      responses:
        "200":
          description: Lista de cuentas de canal
          content:
            application/json:
              schema:
                type: object
                properties:
                  cuentas:
                    type: array
                    items: { $ref: "#/components/schemas/CuentaCanal" }

  /canales/cuentas:
    post:
      tags: [canales]
      summary: Registrar una cuenta de canal — admin_gestora/superadmin (credenciales cifradas AES-256-GCM)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearCuentaCanal" }
      responses:
        "201": { description: Cuenta creada }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /canales/{id}/sync:
    post:
      tags: [canales]
      summary: Encolar una sincronización manual (la ejecuta el worker de Lote 2)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202": { description: Solicitud encolada en outbox_evento }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /auditoria:
    get:
      tags: [auditoria]
      summary: Consulta paginada del log de auditoría — admin_gestora/superadmin
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamano
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de entradas de auditoría
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaAuditoriaPaginada" }
        "403": { $ref: "#/components/responses/RolForbidden" }

  # ---------------------------------------------------------------------
  # Operación: limpieza/mantenimiento/inspección (Lote 5, BACKLOG E08).
  # Rol `limpieza` solo ve/opera sus propias tareas asignadas (RLS,
  # packages/db migración 0036); propietario tiene solo lectura de la
  # operación de sus propias unidades.
  # ---------------------------------------------------------------------
  /operacion/tareas:
    get:
      tags: [operacion]
      summary: Lista tareas operativas (filtrable por unidadId/estado/programadaPara)
      parameters:
        - name: unidadId
          in: query
          schema: { type: string, format: uuid }
        - name: estado
          in: query
          schema: { type: string }
        - name: programadaPara
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Lista de tareas visibles para el rol actual (filtrado por RLS)
          content:
            application/json:
              schema:
                type: object
                properties:
                  tareas:
                    type: array
                    items: { $ref: "#/components/schemas/TareaOperativa" }
    post:
      tags: [operacion]
      summary: Crea una tarea MANUAL (mantenimiento/inspección) — 'limpieza' siempre se genera vía checkout (H-049)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearTareaOperativa" }
      responses:
        "201":
          description: Tarea creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TareaOperativa" }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /operacion/tareas/calendario:
    get:
      tags: [operacion]
      summary: Turnos por día (H-049) — agrupa tareas por `programadaPara` dentro de [desde, hasta]
      parameters:
        - name: desde
          in: query
          required: true
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: true
          schema: { type: string, format: date }
        - name: unidadId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Turnos agrupados por día
          content:
            application/json:
              schema:
                type: object
                properties:
                  turnos:
                    type: array
                    items: { $ref: "#/components/schemas/TurnoDia" }

  /operacion/tareas/procesar-eventos:
    post:
      tags: [operacion]
      summary: Dispara manualmente el consumidor de outbox_evento (H-049) — genera/reprograma/cancela tareas de limpieza según checkouts confirmados/modificados/cancelados
      responses:
        "200":
          description: Resumen de eventos procesados
          content:
            application/json:
              schema:
                type: object
                properties:
                  procesados: { type: integer }
                  tareasCreadas: { type: array, items: { type: string, format: uuid } }
                  tareasReprogramadas: { type: array, items: { type: string, format: uuid } }
                  tareasCanceladas: { type: array, items: { type: string, format: uuid } }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /operacion/tareas/{id}:
    get:
      tags: [operacion]
      summary: Detalle de una tarea con su checklist
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tarea con checklist
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TareaOperativa"
                  - type: object
                    properties:
                      checklist:
                        type: array
                        items: { $ref: "#/components/schemas/ChecklistItem" }
        "404": { description: Tarea no encontrada o sin acceso (RLS) }

  /operacion/tareas/{id}/asignar:
    patch:
      tags: [operacion]
      summary: Asigna la tarea a personal interno o proveedor externo (H-053)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoAsignarTarea" }
      responses:
        "200": { description: Tarea asignada }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /operacion/tareas/{id}/checklist/{itemId}/completar:
    post:
      tags: [operacion]
      summary: Completa un ítem del checklist con timestamp y fotos opcionales (H-051)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCompletarChecklistItem" }
      responses:
        "204": { description: Ítem completado }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /operacion/tareas/{id}/completar:
    post:
      tags: [operacion]
      summary: Completa la tarea — exige checklist completo (409 si incompleto, REQ-113) y descuenta inventario configurado (H-052)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCompletarTarea" }
      responses:
        "200": { description: Tarea completada, con alertas de stock bajo si aplica }
        "409": { description: Checklist incompleto — la tarea queda en estado 'bloqueada' }

  /operacion/incidencias:
    get:
      tags: [operacion]
      summary: Lista incidencias de mantenimiento (RLS limita 'limpieza' a las suyas)
      parameters:
        - name: unidadId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lista de incidencias
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidencias:
                    type: array
                    items: { $ref: "#/components/schemas/Incidencia" }
    post:
      tags: [operacion]
      summary: Reporta una incidencia de mantenimiento (H-055) — severidad 'grave' con propuestaBloqueoRango queda en estado 'bloqueo_propuesto'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearIncidencia" }
      responses:
        "201":
          description: Incidencia registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incidencia" }

  /operacion/incidencias/{id}/confirmar-bloqueo:
    post:
      tags: [operacion]
      summary: |
        Confirma el bloqueo de mantenimiento propuesto por una incidencia grave
        (H-055, REQ-118) — decisión de producto explícita, NUNCA automática:
        exige un `confirmadoPor` humano (el usuario autenticado) y delega en
        `crearBloqueo` de Lote 1, que jamás cancela reservas existentes; un
        solape con una reserva confirmada se registra como conflicto
        `capa_cruzada`, nunca rechaza la operación.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rango: { $ref: "#/components/schemas/RangoFechas" }
      responses:
        "200": { description: Bloqueo de mantenimiento confirmado y creado en el calendario }
        "422": { description: La incidencia no es severidad 'grave', o no hay rango propuesto/provisto }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /operacion/inventario:
    get:
      tags: [operacion]
      summary: Inventario mínimo de ropa blanca/consumibles por unidad (H-052)
      parameters:
        - name: unidadId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lista de ítems de inventario
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ItemInventario" }
    post:
      tags: [operacion]
      summary: Registra un ítem de inventario para una unidad
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearItemInventario" }
      responses:
        "201":
          description: Ítem creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemInventario" }
        "403": { $ref: "#/components/responses/RolForbidden" }

  # -------------------------------------------------------------------
  # Finanzas / owners / statements (Lote 7, BACKLOG E10, RV12)
  # -------------------------------------------------------------------
  /finanzas/reglas-comision:
    get:
      tags: [finanzas]
      summary: Reglas de comisión de canal configurables por tenant/propiedad (H-063/H-065)
      responses:
        "200":
          description: Lista de reglas
          content:
            application/json:
              schema:
                type: object
                properties:
                  reglas:
                    type: array
                    items: { $ref: "#/components/schemas/ReglaComisionCanal" }
    post:
      tags: [finanzas]
      summary: Crea/versiona una regla de comisión de canal (nunca hardcodeada, RV12 R1/R5)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoReglaComisionCanal" }
      responses:
        "201": { description: Regla creada }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /finanzas/reservas/{ocupacionId}/movimiento:
    post:
      tags: [finanzas]
      summary: Calcula y persiste el movimiento financiero de una reserva (H-062/H-063, Finanzas-1 — nunca doble descuento)
      parameters:
        - name: ocupacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoMovimientoReserva" }
      responses:
        "201": { description: Movimiento calculado y persistido }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /finanzas/reservas/{ocupacionId}:
    get:
      tags: [finanzas]
      summary: Lee el movimiento financiero de una reserva + alerta de retención (H-067, sin calcular impuestos, B-005)
      parameters:
        - name: ocupacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Movimiento financiero }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /finanzas/statements/generar:
    post:
      tags: [finanzas]
      summary: Genera (idempotente y versionado) el owner statement de un periodo (H-062)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoGenerarStatement" }
      responses:
        "201": { description: Nueva versión creada }
        "200": { description: Contenido idéntico a la versión vigente — no se creó una nueva versión }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /finanzas/statements:
    get:
      tags: [finanzas]
      summary: Lista la última versión de cada owner statement visible para el rol actual (propietario solo ve los suyos)
      parameters:
        - name: ownerId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Lista de statements }

  /finanzas/statements/{id}:
    get:
      tags: [finanzas]
      summary: Detalle de un owner statement con sus líneas
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Statement con líneas }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /finanzas/statements/{id}/descarga:
    get:
      tags: [finanzas]
      summary: Descarga HTML imprimible del statement (dev — nunca un CFDI ni comprobante fiscal)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: HTML del statement
          content:
            text/html: { schema: { type: string } }

  /finanzas/payouts:
    post:
      tags: [finanzas]
      summary: Importa un payout de canal y concilia sus líneas contra reservas (H-064, Finanzas-2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoImportarPayout" }
      responses:
        "201": { description: Payout importado y conciliado }

  /finanzas/payouts/{id}:
    get:
      tags: [finanzas]
      summary: Detalle de un payout con el estado de conciliación de cada línea
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Payout con líneas }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /finanzas/alerta-fiscal/{unidadId}:
    get:
      tags: [finanzas]
      summary: Alerta de retención fiscal por RFC ausente — SIN calcular ningún monto (H-067, B-005)
      parameters:
        - name: unidadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Alerta fiscal }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  # -------------------------------------------------------------------
  # Pricing básico (Lote 7, BACKLOG E11, RV13)
  # -------------------------------------------------------------------
  /pricing/unidades/{unidadId}:
    get:
      tags: [pricing]
      summary: Contexto de pricing completo de una unidad (base, temporadas, descuentos, min-stay)
      parameters:
        - name: unidadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Contexto de pricing }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /pricing/unidades/{unidadId}/base:
    post:
      tags: [pricing]
      summary: Fija el precio base por noche de una unidad
      parameters:
        - name: unidadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoTarifaBase" }
      responses:
        "201": { description: Tarifa base creada/actualizada }

  /pricing/unidades/{unidadId}/temporadas:
    post:
      tags: [pricing]
      summary: Añade una temporada con precio propio (H-068)
      parameters:
        - name: unidadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoTarifaTemporada" }
      responses:
        "201": { description: Temporada creada }

  /pricing/unidades/{unidadId}/descuentos-duracion:
    post:
      tags: [pricing]
      summary: Descuento por duración de estancia (7/28 noches como dato con fuente, RV13-R-02)
      parameters:
        - name: unidadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoDescuentoDuracion" }
      responses:
        "201": { description: Descuento creado/actualizado }

  /pricing/unidades/{unidadId}/min-stay:
    post:
      tags: [pricing]
      summary: Regla de estancia mínima por rango de fechas y día de check-in (RV13-R-03)
      parameters:
        - name: unidadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoMinStay" }
      responses:
        "201": { description: Regla de min-stay creada }

  /pricing/unidades/{unidadId}/reglas-canal:
    post:
      tags: [pricing]
      summary: Markup por canal (comisión) para pricing publicado (RV13-R-04)
      parameters:
        - name: unidadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoReglaCanalPricing" }
      responses:
        "201": { description: Regla de canal creada/actualizada }

  /pricing/unidades/{unidadId}/publicacion/{canalCodigo}:
    get:
      tags: [pricing]
      summary: Evalúa si las tarifas se pueden publicar hacia un canal (SOLO si declara ratesPush:true, H-069)
      parameters:
        - name: unidadId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: canalCodigo
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: "Evaluación { puedePublicar, mensaje } — hoy siempre false: ningún adaptador real de Fase 2 declara ratesPush" }

  /pricing/cotizar:
    post:
      tags: [pricing]
      summary: Cotización determinista de una estadía para reserva directa (H-068)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCotizar" }
      responses:
        "200": { description: Cotización calculada }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "422": { description: Rango inválido o sin noches }

  # -------------------------------------------------------------------
  # Reporting (Lote 7, BACKLOG E12) — solo lectura de reserva/statement,
  # sin duplicar lógica de cálculo.
  # -------------------------------------------------------------------
  /reportes/ocupacion:
    get:
      tags: [reportes]
      summary: Ocupación/ADR/RevPAR por unidad en un rango (H-072/H-073)
      parameters:
        - name: desde
          in: query
          required: true
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: true
          schema: { type: string, format: date }
        - name: propiedadId
          in: query
          schema: { type: string, format: uuid }
        - name: formato
          in: query
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: Reporte de ocupación (JSON o CSV descargable según `formato`)

  /reportes/ingresos:
    get:
      tags: [reportes]
      summary: Ingresos agrupados por canal/propiedad/mes (H-072)
      parameters:
        - name: desde
          in: query
          required: true
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: true
          schema: { type: string, format: date }
        - name: propiedadId
          in: query
          schema: { type: string, format: uuid }
        - name: formato
          in: query
          schema: { type: string, enum: [json, csv] }
      responses:
        "200": { description: Reporte de ingresos (JSON o CSV descargable) }

  # ---------------------------------------------------------------------
  # Back office / superadmin (Lote 8, BACKLOG E13 + E02 H-011/H-012).
  # `/backoffice/tenants` (directorio, sin concesión) vs. el resto de
  # rutas (propiedades/unidades/cuentas-canal/usuarios/auditoria), que
  # exigen una concesión "romper cristal" vigente para que un superadmin
  # opere sobre un tenant que no es el suyo (RLS, packages/db migración
  # 0061 — ver `AccesoRomperCristal` más abajo).
  # ---------------------------------------------------------------------
  /backoffice/tenants:
    get:
      tags: [backoffice]
      summary: Directorio de tenants con métricas agregadas — superadmin, SIN concesión "romper cristal"
      responses:
        "200":
          description: Directorio de tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items: { $ref: "#/components/schemas/TenantDirectorio" }
        "403": { $ref: "#/components/responses/RolForbidden" }
    post:
      tags: [backoffice]
      summary: Alta de tenant (empresa gestora) — superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearTenantBackoffice" }
      responses:
        "201": { description: Tenant creado }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /backoffice/tenants/{id}/suspender:
    post:
      tags: [backoffice]
      summary: Suspender un tenant con motivo — superadmin
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoSuspenderTenant" }
      responses:
        "200": { description: Tenant suspendido }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /backoffice/tenants/{id}/activar:
    post:
      tags: [backoffice]
      summary: Reactivar un tenant suspendido — superadmin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Tenant activo }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /backoffice/romper-cristal:
    get:
      tags: [backoffice]
      summary: Concesiones "romper cristal" propias vigentes — superadmin (para el banner persistente)
      responses:
        "200":
          description: Concesiones vigentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  accesos:
                    type: array
                    items: { $ref: "#/components/schemas/AccesoRomperCristal" }
    post:
      tags: [backoffice]
      summary: Crear una concesión "romper cristal" (motivo obligatorio, ventana acotada) — superadmin
      description: |
        Genera una entrada `ACCESO_ROMPER_CRISTAL` en `auditoria_mutacion`
        con actor, tenant y motivo (§Auditoría-1). Sin esta concesión,
        `is_tenant_member` deniega a un superadmin el acceso a datos de
        negocio de cualquier tenant (packages/db migración 0061).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearAccesoRomperCristal" }
      responses:
        "201": { description: Concesión creada }
        "403": { $ref: "#/components/responses/RolForbidden" }

  /backoffice/romper-cristal/{id}/revocar:
    post:
      tags: [backoffice]
      summary: Revocar una concesión propia antes de su expiración — superadmin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Concesión revocada }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /backoffice/flags:
    get:
      tags: [backoffice]
      summary: Catálogo de feature flags con valor global/por-tenant — superadmin
      parameters:
        - name: tenantId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Catálogo de flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags:
                    type: array
                    items: { $ref: "#/components/schemas/Flag" }

  /backoffice/flags/{id}:
    patch:
      tags: [backoffice]
      summary: Cambiar el valor de un flag (global o por tenant), con motivo auditado — superadmin
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoEstablecerFlag" }
      responses:
        "200": { description: Flag actualizado }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /backoffice/flags/{id}/auditoria:
    get:
      tags: [backoffice]
      summary: Historial de cambios de un flag — superadmin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Entradas de auditoría del flag }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /backoffice/propiedades:
    get:
      tags: [backoffice]
      summary: CRUD de administración de propiedades — zona horaria/dirección/moneda
      parameters:
        - name: tenantId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Propiedades del tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  propiedades:
                    type: array
                    items: { $ref: "#/components/schemas/PropiedadBackoffice" }
        "403": { $ref: "#/components/responses/RolForbidden" }
    post:
      tags: [backoffice]
      summary: Alta de propiedad — zona horaria IANA, dirección mínima y moneda obligatorias (H-011)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearPropiedadBackoffice" }
      responses:
        "201": { description: Propiedad creada }
        "422": { $ref: "#/components/responses/Validacion" }

  /backoffice/propiedades/{id}:
    patch:
      tags: [backoffice]
      summary: Actualizar propiedad
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoActualizarPropiedadBackoffice" }
      responses:
        "200": { description: Propiedad actualizada }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /backoffice/unidades:
    get:
      tags: [backoffice]
      summary: CRUD de administración de unidades
      parameters:
        - name: propiedadId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Unidades de la propiedad }
    post:
      tags: [backoffice]
      summary: Alta de unidad(es) — `cantidad` crea N unidades independientes de una sola vez (H-012)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearUnidadBackoffice" }
      responses:
        "201": { description: Unidad(es) creada(s) }

  /backoffice/unidades/{id}:
    patch:
      tags: [backoffice]
      summary: Actualizar unidad
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Unidad actualizada }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    delete:
      tags: [backoffice]
      summary: Eliminar unidad
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Unidad eliminada }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /backoffice/cuentas-canal:
    get:
      tags: [backoffice]
      summary: Cuentas de canal del tenant — nunca expone credenciales, solo "configurada/no configurada"
      parameters:
        - name: tenantId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Cuentas de canal del tenant }
    post:
      tags: [backoffice]
      summary: Alta con tipo de conexión honesto — iCal / partner pendiente (con motivo) / simulador (solo dev)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearCuentaCanalBackoffice" }
      responses:
        "201": { description: Cuenta creada }
        "422": { $ref: "#/components/responses/Validacion" }

  /backoffice/usuarios:
    get:
      tags: [backoffice]
      summary: Usuarios/roles del tenant
      parameters:
        - name: tenantId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Usuarios del tenant }

  /backoffice/usuarios/invitaciones:
    get:
      tags: [backoffice]
      summary: Invitaciones del tenant
      parameters:
        - name: tenantId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Invitaciones del tenant }
    post:
      tags: [backoffice]
      summary: Invitar a un colaborador (token devuelto UNA sola vez, nunca persistido en claro)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuerpoCrearInvitacion" }
      responses:
        "201": { description: Invitación creada (incluye `token` una sola vez) }

  /backoffice/usuarios/invitaciones/{id}/revocar:
    post:
      tags: [backoffice]
      summary: Revocar una invitación pendiente
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Invitación revocada }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /backoffice/auditoria:
    get:
      tags: [backoffice]
      summary: Auditoría consultable con filtros (tabla/operación/actor/rango de fechas)
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamano
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: tabla
          in: query
          schema: { type: string }
        - name: operacion
          in: query
          schema: { type: string, enum: [INSERT, UPDATE, DELETE, ACCESO_ROMPER_CRISTAL] }
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: desde
          in: query
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Página de entradas de auditoría filtradas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaAuditoriaPaginada" }
        "403": { $ref: "#/components/responses/RolForbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Validacion:
      description: Error de validación de entrada (zod)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorHttp" }
    RangoInvalido:
      description: "rango_invalido: el rango de fechas no cumple inicio < fin (u otra regla de negocio de fechas)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorHttp" }
    UnidadNoDisponible:
      description: "unidad_no_disponible: la unidad ya tiene una reserva confirmada en ese rango"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorHttp" }
    ConflictoPendiente:
      description: "conflicto_pendiente: la operación no puede completarse por un conflicto sin resolver"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorHttp" }
    TenantForbidden:
      description: "tenant_forbidden: el usuario no pertenece al tenant solicitado"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorHttp" }
    RolForbidden:
      description: "rol_forbidden: el rol/nivel de colaborador no tiene permiso para esta acción"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorHttp" }
    NoEncontrado:
      description: "recurso_no_encontrado (incluye recursos de otro tenant, ocultos por RLS — nunca confirma su existencia)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorHttp" }

  schemas:
    ErrorHttp:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              enum:
                - credenciales_invalidas
                - token_invalido
                - token_expirado
                - tenant_forbidden
                - rol_forbidden
                - rango_invalido
                - unidad_no_disponible
                - conflicto_pendiente
                - reserva_no_directa
                - recurso_no_encontrado
                - validacion
                - rate_limited
                - error_interno
            mensaje: { type: string }
            detalles: {}

    CuerpoLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    CuerpoRefresh:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    UsuarioSesion:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid, nullable: true }
        rol: { $ref: "#/components/schemas/RolUsuario" }
        colaboradorNivel: { $ref: "#/components/schemas/ColaboradorNivel" }

    RolUsuario:
      type: string
      enum: [superadmin, admin_gestora, operador, limpieza, propietario, contador]

    ColaboradorNivel:
      type: string
      nullable: true
      enum: [acceso_total, calendario_mensajeria, solo_calendario]

    RespuestaTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiraEn: { type: integer }
        usuario: { $ref: "#/components/schemas/UsuarioSesion" }

    CuerpoCrearUsuario:
      type: object
      required: [email, password, rol]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        rol: { $ref: "#/components/schemas/RolUsuario" }
        colaboradorNivel: { $ref: "#/components/schemas/ColaboradorNivel" }
        ownerId: { type: string, format: uuid }

    CuerpoCrearPropiedad:
      type: object
      required: [nombre, zonaHoraria]
      properties:
        nombre: { type: string }
        zonaHoraria: { type: string, description: "Zona horaria IANA, p. ej. America/Cancun" }

    CuerpoCrearUnidad:
      type: object
      required: [propiedadId, nombre]
      properties:
        propiedadId: { type: string, format: uuid }
        nombre: { type: string }
        ownerId: { type: string, format: uuid }
        duracionMinimaNoches: { type: integer, minimum: 1 }

    RangoFechas:
      type: object
      required: [inicio, fin]
      properties:
        inicio: { type: string, format: date, description: "Inclusivo (check-in)" }
        fin: { type: string, format: date, description: "Exclusivo (check-out)" }

    NocheCalendario:
      type: object
      properties:
        fecha: { type: string, format: date }
        ocupada: { type: boolean }
        capa: { type: string, enum: [reserva, bloqueo], nullable: true }
        razon:
          type: string
          nullable: true
          enum: [RESERVA_CANAL, BLOQUEO_PROPIETARIO, MANTENIMIENTO, BUFFER_LIMPIEZA]
        estado:
          type: string
          nullable: true
          enum: [confirmado, provisional, cancelado, conflicto_pendiente]
        origenCanal: { type: string, nullable: true }
        esDirecta: { type: boolean }

    RespuestaCalendario:
      type: object
      properties:
        unidadId: { type: string, format: uuid }
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        noches:
          type: array
          items: { $ref: "#/components/schemas/NocheCalendario" }

    CuerpoCrearReserva:
      type: object
      required: [unidadId, rango]
      properties:
        unidadId: { type: string, format: uuid }
        rango: { $ref: "#/components/schemas/RangoFechas" }
        huespedNombre: { type: string }
        huespedContacto: { type: string }

    CuerpoModificarReserva:
      type: object
      required: [rango]
      properties:
        rango: { $ref: "#/components/schemas/RangoFechas" }

    CuerpoCrearBloqueo:
      type: object
      required: [unidadId, rango, razon]
      properties:
        unidadId: { type: string, format: uuid }
        rango: { $ref: "#/components/schemas/RangoFechas" }
        razon:
          type: string
          enum: [BLOQUEO_PROPIETARIO, MANTENIMIENTO, BUFFER_LIMPIEZA]

    EstadoConexionCanal:
      type: string
      enum: [no_conectado, simulador, ical, partner_pendiente, sandbox, produccion]
      description: >-
        Estado honesto (D-017/D-019): "simulador" nunca se confunde con
        "produccion"; "produccion" exige evidencia verificable de sync
        exitoso reciente.

    CuentaCanal:
      type: object
      properties:
        id: { type: string, format: uuid }
        canalCodigo: { type: string }
        nombre: { type: string }
        estadoConexion: { $ref: "#/components/schemas/EstadoConexionCanal" }
        esSimulador: { type: boolean }
        ultimaSincronizacionExitosaEn: { type: string, format: date-time, nullable: true }

    CuerpoCrearCuentaCanal:
      type: object
      required: [canalCodigo, nombre]
      properties:
        tenantId: { type: string, format: uuid }
        propiedadId: { type: string, format: uuid }
        canalCodigo: { type: string, enum: [airbnb, vrbo, booking, manual] }
        nombre: { type: string }
        credenciales:
          type: object
          additionalProperties: { type: string }
          description: Se cifra con AES-256-GCM antes de persistir (H-046) — nunca se guarda en claro.
        esSimulador: { type: boolean }

    ConflictoCalendario:
      type: object
      properties:
        id: { type: string, format: uuid }
        unidadId: { type: string, format: uuid }
        tipo: { type: string, enum: [capa_cruzada, overbooking_confirmado] }
        detectadoEn: { type: string, format: date-time }
        resueltoEn: { type: string, format: date-time, nullable: true }

    EntradaAuditoria:
      type: object
      properties:
        id: { type: string, format: uuid }
        tabla: { type: string }
        filaId: { type: string, format: uuid }
        operacion: { type: string, enum: [INSERT, UPDATE, DELETE, ACCESO_ROMPER_CRISTAL] }
        actorId: { type: string, format: uuid, nullable: true }
        creadoEn: { type: string, format: date-time }
        valoresPrevios: { nullable: true }
        valoresNuevos: { nullable: true }

    RespuestaAuditoriaPaginada:
      type: object
      properties:
        pagina: { type: integer }
        tamano: { type: integer }
        total: { type: integer }
        entradas:
          type: array
          items: { $ref: "#/components/schemas/EntradaAuditoria" }

    # -----------------------------------------------------------------
    # Operación: limpieza/mantenimiento/inspección (Lote 5, BACKLOG E08)
    # -----------------------------------------------------------------
    TareaOperativa:
      type: object
      properties:
        id: { type: string, format: uuid }
        unidadId: { type: string, format: uuid }
        ocupacionUnidadId: { type: string, format: uuid, nullable: true }
        bufferOcupacionId: { type: string, format: uuid, nullable: true }
        tipo: { type: string, enum: [limpieza, mantenimiento, inspeccion] }
        estado: { type: string, enum: [pendiente, asignada, en_progreso, completada, bloqueada, cancelada] }
        prioridad: { type: string, enum: [baja, media, alta, urgente] }
        asignadoA: { type: string, format: uuid, nullable: true }
        esProveedorExterno: { type: boolean }
        programadaPara: { type: string, format: date }
        slaVenceEn: { type: string, format: date-time, nullable: true }
        completadaEn: { type: string, format: date-time, nullable: true }
        notas: { type: string, nullable: true }

    CuerpoCrearTareaOperativa:
      type: object
      required: [unidadId, tipo, programadaPara]
      properties:
        unidadId: { type: string, format: uuid }
        tipo: { type: string, enum: [mantenimiento, inspeccion] }
        prioridad: { type: string, enum: [baja, media, alta, urgente] }
        programadaPara: { type: string, format: date }
        notas: { type: string }

    CuerpoAsignarTarea:
      type: object
      required: [asignadoA]
      properties:
        asignadoA: { type: string, format: uuid }
        esProveedorExterno: { type: boolean, default: false }

    ChecklistItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        tareaId: { type: string, format: uuid }
        descripcion: { type: string }
        orden: { type: integer }
        completado: { type: boolean }
        completadoEn: { type: string, format: date-time, nullable: true }
        completadoPor: { type: string, format: uuid, nullable: true }

    CuerpoCompletarChecklistItem:
      type: object
      properties:
        fotos:
          type: array
          items:
            type: object
            properties:
              rutaAlmacenamiento: { type: string, description: "Metadato de almacenamiento local de desarrollo (dev-local), REQ-113" }

    CuerpoCompletarTarea:
      type: object
      properties:
        consumos:
          type: array
          items:
            type: object
            properties:
              itemInventarioId: { type: string, format: uuid }
              cantidad: { type: number }

    TurnoDia:
      type: object
      properties:
        fecha: { type: string, format: date }
        tareas:
          type: array
          items: { $ref: "#/components/schemas/TareaOperativa" }

    Incidencia:
      type: object
      properties:
        id: { type: string, format: uuid }
        unidadId: { type: string, format: uuid }
        severidad: { type: string, enum: [leve, moderada, grave] }
        titulo: { type: string }
        descripcion: { type: string, nullable: true }
        estado:
          type: string
          enum: [abierta, en_revision, bloqueo_propuesto, bloqueo_confirmado, resuelta, descartada]
        requiereConfirmacionHumana: { type: boolean }

    CuerpoCrearIncidencia:
      type: object
      required: [unidadId, severidad, titulo]
      properties:
        unidadId: { type: string, format: uuid }
        tareaOrigenId: { type: string, format: uuid }
        severidad: { type: string, enum: [leve, moderada, grave] }
        titulo: { type: string }
        descripcion: { type: string }
        propuestaBloqueoRango: { $ref: "#/components/schemas/RangoFechas" }

    ItemInventario:
      type: object
      properties:
        id: { type: string, format: uuid }
        unidadId: { type: string, format: uuid }
        nombre: { type: string }
        categoria: { type: string, enum: [ropa_blanca, consumible, otro] }
        cantidadActual: { type: number }
        umbralMinimo: { type: number }
        unidadMedida: { type: string }
        stockBajo: { type: boolean }

    CuerpoCrearItemInventario:
      type: object
      required: [unidadId, nombre]
      properties:
        unidadId: { type: string, format: uuid }
        nombre: { type: string }
        categoria: { type: string, enum: [ropa_blanca, consumible, otro], default: consumible }
        cantidadActual: { type: number, default: 0 }
        umbralMinimo: { type: number, default: 0 }
        unidadMedida: { type: string, default: pza }

    # -----------------------------------------------------------------
    # Finanzas / owners / statements (Lote 7)
    # -----------------------------------------------------------------
    ReglaComisionCanal:
      type: object
      properties:
        id: { type: string, format: uuid }
        canalCodigo: { type: string, enum: [airbnb, vrbo, booking, manual] }
        propiedadId: { type: string, format: uuid, nullable: true }
        yaNetoDeComision: { type: boolean, description: "true = el canal ya entrega el monto neto de su comisión (caso Airbnb confirmado, L-RV12-02)" }
        comisionBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        fuente: { type: string, description: "Cita obligatoria de la fuente/fecha de la cifra (RV12 R1/R5) — nunca un valor mudo" }
        vigenteDesde: { type: string, format: date }

    CuerpoReglaComisionCanal:
      type: object
      required: [canalCodigo, yaNetoDeComision, comisionBasisPoints, fuente]
      properties:
        canalCodigo: { type: string, enum: [airbnb, vrbo, booking, manual] }
        propiedadId: { type: string, format: uuid }
        yaNetoDeComision: { type: boolean }
        comisionBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        fuente: { type: string }
        vigenteDesde: { type: string, format: date }

    CuerpoLineaGasto:
      type: object
      required: [tipo, montoCentavos]
      properties:
        tipo: { type: string }
        descripcion: { type: string }
        montoCentavos: { type: integer, minimum: 0 }

    CuerpoLineaImpuesto:
      type: object
      required: [tipo, montoCentavos]
      properties:
        tipo: { type: string }
        montoCentavos: { type: integer, minimum: 0 }
        nota:
          type: string
          description: "Siempre tratado como revisión legal/fiscal pendiente (B-005) — nunca una cifra definitiva"

    CuerpoMovimientoReserva:
      type: object
      required: [moneda, montoBrutoCentavos, comisionGestorBasisPoints]
      properties:
        moneda: { type: string, pattern: "^[A-Z]{3}$" }
        montoBrutoCentavos: { type: integer, minimum: 0 }
        comisionGestorBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        comisionGestorBase: { type: string, enum: [bruto, neto_de_canal], default: neto_de_canal }
        gastos:
          type: array
          items: { $ref: "#/components/schemas/CuerpoLineaGasto" }
        impuestos:
          type: array
          items: { $ref: "#/components/schemas/CuerpoLineaImpuesto" }

    CuerpoGenerarStatement:
      type: object
      required: [ownerId, periodoInicio, periodoFin]
      properties:
        ownerId: { type: string, format: uuid }
        periodoInicio: { type: string, format: date }
        periodoFin: { type: string, format: date }
        motivoVersion: { type: string }

    CuerpoImportarPayout:
      type: object
      required: [canalCodigo, moneda, fechaPayout, lineas]
      properties:
        canalCodigo: { type: string, enum: [airbnb, vrbo, booking, manual] }
        moneda: { type: string, pattern: "^[A-Z]{3}$" }
        fechaPayout: { type: string, format: date }
        referenciaExterna: { type: string }
        lineas:
          type: array
          items:
            type: object
            required: [montoCentavos]
            properties:
              referenciaExternaReserva: { type: string }
              montoCentavos: { type: integer }

    AlertaRetencionFiscal:
      type: object
      properties:
        rfcRegistrado: { type: boolean }
        requiereRevisionFiscal: { type: boolean, enum: [true], description: "Siempre true — B-005, ninguna cifra fiscal es definitiva sin revisión legal" }
        mensaje: { type: string }

    # -----------------------------------------------------------------
    # Pricing básico (Lote 7)
    # -----------------------------------------------------------------
    CuerpoTarifaBase:
      type: object
      required: [precioNocheCentavos, moneda]
      properties:
        precioNocheCentavos: { type: integer, minimum: 0 }
        moneda: { type: string, pattern: "^[A-Z]{3}$" }
        vigenteDesde: { type: string, format: date }

    CuerpoTarifaTemporada:
      type: object
      required: [nombre, rango, precioNocheCentavos, moneda]
      properties:
        nombre: { type: string }
        rango: { $ref: "#/components/schemas/RangoFechas" }
        precioNocheCentavos: { type: integer, minimum: 0 }
        moneda: { type: string, pattern: "^[A-Z]{3}$" }

    CuerpoDescuentoDuracion:
      type: object
      required: [nochesMinimas, porcentajeDescuentoBasisPoints, fuente]
      properties:
        nochesMinimas: { type: integer, minimum: 1, description: "Umbrales estándar RV13: 7 (semanal), 28 (mensual)" }
        porcentajeDescuentoBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        fuente: { type: string }

    CuerpoMinStay:
      type: object
      required: [rango, nochesMinimas]
      properties:
        rango: { $ref: "#/components/schemas/RangoFechas" }
        diaSemanaCheckIn: { type: integer, minimum: 0, maximum: 6, nullable: true, description: "0=domingo..6=sábado; null=todos los días" }
        nochesMinimas: { type: integer, minimum: 1 }

    CuerpoReglaCanalPricing:
      type: object
      required: [canalCodigo, markupBasisPoints]
      properties:
        canalCodigo: { type: string, enum: [airbnb, vrbo, booking, manual] }
        markupBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        activo: { type: boolean, default: false }

    CuerpoCotizar:
      type: object
      required: [unidadId, rango]
      properties:
        unidadId: { type: string, format: uuid }
        rango: { $ref: "#/components/schemas/RangoFechas" }
        canalCodigo: { type: string, enum: [airbnb, vrbo, booking, manual] }

    # -----------------------------------------------------------------
    # Back office / superadmin (Lote 8).
    # -----------------------------------------------------------------
    MetricasTenant:
      type: object
      properties:
        unidadesTotal: { type: integer, minimum: 0 }
        cuentasCanalTotal: { type: integer, minimum: 0 }
        cuentasCanalConfiguradas: { type: integer, minimum: 0 }
        cuentasCanalSimulador: { type: integer, minimum: 0 }
        alertasAbiertas: { type: integer, minimum: 0 }
        outboxPendiente: { type: integer, minimum: 0 }

    TenantDirectorio:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { type: string }
        estado: { type: string, enum: [activo, suspendido] }
        suspendidoMotivo: { type: string, nullable: true }
        creadoEn: { type: string, format: date-time }
        metricas: { $ref: "#/components/schemas/MetricasTenant" }

    CuerpoCrearTenantBackoffice:
      type: object
      required: [nombre, razonSocial]
      properties:
        nombre: { type: string }
        razonSocial: { type: string }

    CuerpoSuspenderTenant:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 1 }

    CuerpoCrearAccesoRomperCristal:
      type: object
      required: [tenantId, motivo]
      properties:
        tenantId: { type: string, format: uuid }
        motivo: { type: string, minLength: 1 }
        alcance: { type: string, default: general }
        minutos: { type: integer, minimum: 1, maximum: 1440, default: 30 }

    AccesoRomperCristal:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        motivo: { type: string }
        alcance: { type: string }
        creadoEn: { type: string, format: date-time }
        expiraEn: { type: string, format: date-time }
        revocadoEn: { type: string, format: date-time, nullable: true }

    CuerpoEstablecerFlag:
      type: object
      required: [valor, motivo]
      properties:
        valor: { type: boolean }
        tenantId: { type: string, format: uuid }
        motivo: { type: string, minLength: 1 }

    Flag:
      type: object
      properties:
        id: { type: string }
        descripcion: { type: string }
        categoriaRiesgo: { type: string }
        valorGlobal: { type: boolean }
        valorEfectivo: { type: boolean }
        overrideDeTenant: { type: boolean }

    DireccionMinima:
      type: object
      required: [linea1, ciudad, pais]
      properties:
        linea1: { type: string, minLength: 1 }
        ciudad: { type: string, minLength: 1 }
        pais: { type: string, minLength: 2, maxLength: 2, description: "ISO 3166-1 alfa-2, ej. MX" }

    CuerpoCrearPropiedadBackoffice:
      type: object
      required: [nombre, zonaHoraria, moneda, direccion]
      properties:
        tenantId: { type: string, format: uuid, description: "Requerido si el actor es superadmin" }
        nombre: { type: string }
        zonaHoraria: { type: string, description: "IANA, ej. America/Mexico_City" }
        moneda: { type: string, pattern: "^[A-Z]{3}$" }
        direccion: { $ref: "#/components/schemas/DireccionMinima" }

    CuerpoActualizarPropiedadBackoffice:
      type: object
      properties:
        nombre: { type: string }
        zonaHoraria: { type: string }
        moneda: { type: string, pattern: "^[A-Z]{3}$" }
        direccion: { $ref: "#/components/schemas/DireccionMinima" }

    PropiedadBackoffice:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        nombre: { type: string }
        zonaHoraria: { type: string }
        moneda: { type: string, nullable: true }
        direccion:
          type: object
          nullable: true
          properties:
            linea1: { type: string, nullable: true }
            ciudad: { type: string, nullable: true }
            pais: { type: string, nullable: true }

    CuerpoCrearUnidadBackoffice:
      type: object
      required: [propiedadId, nombre]
      properties:
        propiedadId: { type: string, format: uuid }
        nombre: { type: string }
        ownerId: { type: string, format: uuid }
        duracionMinimaNoches: { type: integer, minimum: 1 }
        cantidad: { type: integer, minimum: 1, maximum: 50, default: 1, description: "Crea N unidades independientes (H-012)" }

    CuerpoCrearCuentaCanalBackoffice:
      type: object
      required: [canalCodigo, nombre, tipoConexion]
      properties:
        tenantId: { type: string, format: uuid }
        propiedadId: { type: string, format: uuid }
        canalCodigo: { type: string, enum: [airbnb, vrbo, booking, manual] }
        nombre: { type: string }
        tipoConexion: { type: string, enum: [ical, partner_pendiente, simulador] }
        motivoPartnerPendiente: { type: string, description: "Obligatorio si tipoConexion=partner_pendiente" }
        urlImport: { type: string, format: uri }
        credenciales: { type: object, additionalProperties: { type: string } }

    CuerpoCrearInvitacion:
      type: object
      required: [email, rol]
      properties:
        email: { type: string, format: email }
        rol: { type: string, enum: [superadmin, admin_gestora, operador, limpieza, propietario, contador] }
        colaboradorNivel: { type: string, enum: [acceso_total, calendario_mensajeria, solo_calendario] }
        ownerId: { type: string, format: uuid }
        ttlHoras: { type: integer, minimum: 1, maximum: 720, default: 72 }
