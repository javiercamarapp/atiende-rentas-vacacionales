# Servido por la imagen `web` de deploy/Dockerfile (VPS/Docker Compose,
# alternativa a Vercel — Lote 3.3). Mismo comportamiento que `vercel.json`:
# SPA (fallback a index.html para rutas de React Router) + proxy de
# `/api/*` al servicio `api` de docker-compose.yml, para que el navegador
# nunca necesite CORS cross-origin (mismo origen que en producción real).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8787/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
